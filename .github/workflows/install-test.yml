name: Install Test

# 在乾淨的 ubuntu runner 上實跑 install.sh，端到端驗證：
# 安裝（Release 下載）→ 服務 active → HTTP 200 → 登入 API → 冪等升級 → 完整移除
# 需要 Release 已有資產（推過 tag）後以手動方式觸發。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: sudo bash install.sh -p 24300

      - name: Service is active
        run: systemctl is-active token-devastator

      - name: Panel HTTP 200
        run: curl -fsS http://127.0.0.1:24300/ | grep -q "token"

      - name: Static assets served
        run: |
          curl -fsS http://127.0.0.1:24300/app.js >/dev/null
          curl -fsS http://127.0.0.1:24300/style.css >/dev/null

      - name: Login API works (default password)
        run: |
          set -e
          resp="$(curl -fsS -X POST http://127.0.0.1:24300/api/login \
            -H 'Content-Type: application/json' -d '{"password":"admin"}')"
          echo "${resp}" | grep -q '"token"'
          echo "${resp}" | grep -q '"isDefault":true'

      - name: Unauthenticated request is 401
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:24300/api/profiles)"
          [ "${code}" = "401" ]

      - name: Re-run install (idempotent upgrade path)
        run: sudo bash install.sh -p 24300

      - name: Service still active after upgrade
        run: systemctl is-active token-devastator

      - name: Uninstall
        run: sudo bash install.sh --uninstall

      - name: Service and files are gone
        run: |
          [ ! -e /usr/local/bin/token-devastator ]
          [ ! -e /etc/systemd/system/token-devastator.service ]
          [ ! -d /etc/token-devastator ]
          if systemctl is-active --quiet token-devastator 2>/dev/null; then
            echo "service still active"; exit 1
          fi

  # 模擬容器型 VPS 對 /usr/local/bin 掛 noexec（203/EXEC Permission denied 故障模式）：
  # 腳本應 exec 自檢失敗後自動改裝 /opt/token-devastator/bin
  install-noexec-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Mount noexec tmpfs over /usr/local/bin and install
        run: |
          sudo mount -t tmpfs -o noexec tmpfs /usr/local/bin
          sudo bash install.sh -p 24300

      - name: Service is active via fallback path
        run: systemctl is-active token-devastator

      - name: Panel HTTP 200
        run: curl -fsS http://127.0.0.1:24300/ | grep -q "token"

      - name: Binary landed on fallback location
        run: |
          [ ! -e /usr/local/bin/token-devastator ]
          [ -x /opt/token-devastator/bin/token-devastator ]
          grep -q 'ExecStart=/opt/token-devastator/bin/token-devastator' /etc/systemd/system/token-devastator.service

      - name: Uninstall cleans all candidate locations
        run: |
          sudo bash install.sh --uninstall
          [ ! -e /opt/token-devastator/bin/token-devastator ]
          [ ! -d /etc/token-devastator ]

      - name: Unmount
        if: always()
        run: sudo umount /usr/local/bin || true

  # 模擬真實案例 VPS：root 可 exec、服務使用者被拒（目錄 0750）。
  # 關鍵在自檢必須以「服務使用者」身分（經 /bin/sh 清 capabilities）進行，
  # 腳本應拒絕 /usr/local/bin 並自動改裝 /opt。
  install-restricted-dir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restrict /usr/local/bin (root-only traverse) and install
        run: |
          sudo chmod 0750 /usr/local/bin
          sudo bash install.sh -p 24300
          sudo chmod 0755 /usr/local/bin

      - name: Service is active via fallback path
        run: systemctl is-active token-devastator

      - name: Binary landed on fallback location & unit points there
        run: |
          [ ! -e /usr/local/bin/token-devastator ]
          [ -x /opt/token-devastator/bin/token-devastator ]
          grep -q 'ExecStart=/opt/token-devastator/bin/token-devastator' /etc/systemd/system/token-devastator.service

      - name: Panel HTTP 200 and login works
        run: |
          curl -fsS http://127.0.0.1:24300/ | grep -q "token"
          curl -fsS -X POST http://127.0.0.1:24300/api/login \
            -H 'Content-Type: application/json' -d '{"password":"admin"}' | grep -q '"isDefault":true'

      - name: Uninstall cleans all candidate locations
        run: |
          sudo bash install.sh --uninstall
          [ ! -e /opt/token-devastator/bin/token-devastator ]
          [ ! -d /etc/token-devastator ]

  install-from-source:
    # 驗證源碼備援路徑：模擬 Release 下載失敗（改用不存在的 tag 直鏈強制 fallback）
    # 不預裝 Go：讓腳本走真實路徑（下載官方 Go 1.26.3 → 編譯）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Patch download URL to force source build fallback
        run: |
          sed -i 's|releases/latest/download|releases/tags/nonexistent-fallback-test/download|' install.sh
          grep -q "nonexistent-fallback-test" install.sh

      - name: Install via source build fallback
        run: sudo bash install.sh -p 24301

      - name: Service is active
        run: systemctl is-active token-devastator

      - name: Panel HTTP 200
        run: curl -fsS http://127.0.0.1:24301/ | grep -q "token"

      - name: Uninstall
        run: sudo bash install.sh --uninstall
